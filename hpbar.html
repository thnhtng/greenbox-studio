<html lang="vi">
<head>

<title>HP Bar Greenbox</title>
<script>(function(){var r=document.documentElement,set=function(v){r.classList.toggle("gbv",v==="v");r.classList.toggle("gbk",v!=="v"&&v!=="d")};try{set(localStorage.getItem("gbc.ui")||"k")}catch(e){set("k")}addEventListener("message",function(e){if((e.origin===location.origin||(location.protocol==='file:'&&e.origin==='null'))&&e.data&&e.data.gbTheme)set(e.data.gbTheme)})})();</script>
<script src="./gb-xp.js"></script>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=Public+Sans:wght@400;500;700&family=Roboto:ital,wght@0,400;0,500;0,700;0,900;1,900&display=swap">
<script src="./vendor/mp4-muxer-5.1.3.js"></script>
<style>
:root{--bg:#0a1322;--panel:#0e1a2e;--sunk:#081222;--ink:#e8f1ff;--muted:#94a9c6;--line:rgba(120,190,255,.22);--accent:#1aa3ff;--mark:#ffb020;--ok:#47c27a;--bad:#ff5d5d;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
html.embed,html.embed body{background:transparent}
main{display:grid;grid-template-columns:minmax(0,1fr) 380px;height:100vh}
#stage{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;padding:12px;gap:8px}
#wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
#cv{max-width:100%;max-height:100%;border-radius:8px;box-shadow:0 0 0 1px var(--line);cursor:grab;
  background:repeating-conic-gradient(#2a3446 0 25%,#1d2533 0 50%) 0 0/24px 24px}
#wrap video{position:absolute;inset:0;margin:auto;max-width:100%;max-height:100%;opacity:.0;pointer-events:none}
.tl{display:flex;gap:8px;align-items:center}
.tl input[type=range]{flex:1}
#marks{position:relative;height:14px;margin:0 6px}
#clips{position:relative;display:flex;height:30px;margin:0 6px;border-radius:6px;overflow:hidden;background:#0d1626;box-shadow:inset 0 0 0 1px var(--line)}
#clips:empty{display:none}
#clips .cl{position:relative;min-width:0;display:flex;align-items:center;gap:4px;padding:0 8px;font-size:11px;color:#eaf6ff;white-space:nowrap;overflow:hidden;cursor:pointer;border-right:2px solid #0d1626}
#clips .cl b{overflow:hidden;text-overflow:ellipsis}
#clips .cl em{font-style:normal;opacity:.7}
#clips .cl.on{box-shadow:inset 0 0 0 2px #ffb020}
#clips .tj{position:absolute;top:0;bottom:0;background:rgba(176,124,255,.55);border-left:1px solid #d9c2ff;border-right:1px solid #d9c2ff;pointer-events:none;font-size:10px;color:#fff;display:flex;align-items:center;justify-content:center}
#clips .add{flex:0 0 auto;display:flex;align-items:center;padding:0 10px;font-size:12px;color:#9fd2ff;cursor:pointer;background:#13213a}
#clips .ph{position:absolute;top:0;bottom:0;width:2px;background:#fff;pointer-events:none}
#clips.drop{box-shadow:inset 0 0 0 2px #2fd17a}
#marks i{position:absolute;top:0;width:3px;height:14px;border-radius:2px;transform:translateX(-1px)}
aside{border-left:1px solid var(--line);overflow:auto;padding:10px 12px 40px;background:var(--panel)}
html.embed aside{background:rgba(14,26,46,.92)}
section{border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin:0 0 10px;background:var(--sunk)}
h3{margin:0 0 7px;font-size:13px;color:#9fd8ff;display:flex;gap:6px;align-items:center}
h3 b{background:var(--accent);color:#fff;border-radius:50%;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-size:11px}
label{display:flex;gap:6px;align-items:center;margin:4px 0}
label>span{min-width:92px;color:var(--muted)}
input,select,button{font:inherit;color:inherit}
input[type=number],input[type=text],select{background:#0b1526;border:1px solid var(--line);border-radius:6px;padding:4px 6px;min-width:0;flex:1}
input[type=color]{width:34px;height:26px;padding:0;border:1px solid var(--line);border-radius:6px;background:none}
input[type=range]{flex:1}
button{background:#17263d;border:1px solid var(--line);border-radius:7px;padding:6px 9px;cursor:pointer}
button:hover{border-color:#71cbff}
button.pri{background:linear-gradient(180deg,#1aa3ff,#0b6fd6);border-color:#71cbff;color:#fff;font-weight:600}
button.alpha{background:linear-gradient(180deg,#8b5cf6,#5b2fd6);border-color:#b9a0ff;color:#fff;font-weight:600}
button.on{background:var(--mark);color:#111;border-color:#a86d00}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:4px 0}
.row>button{flex:1}
.grid9{display:grid;grid-template-columns:repeat(3,34px);gap:3px;margin:4px 0}.grid9 button{padding:3px 0;min-width:0}
.sm{font-size:11.5px;color:var(--muted)}
.msg{font-size:12px;margin-top:6px;min-height:16px}
.msg.err{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:12px}
td,th{padding:3px 4px;border-bottom:1px solid var(--line);text-align:left}
td input,td select{width:100%}
.img{display:flex;gap:6px;align-items:center;margin:4px 0}
.img>span{min-width:92px;color:var(--muted)}
.img img{width:34px;height:34px;object-fit:contain;border-radius:6px;background:#0b1526;border:1px solid var(--line)}
.prog{height:6px;border-radius:3px;background:#0b1526;overflow:hidden;margin-top:6px}
.prog>i{display:block;height:100%;width:0;background:var(--accent)}
details.fxc{border:1px solid var(--line);border-radius:10px;margin:0 0 10px;background:var(--sunk)}
details.fxc>summary{cursor:pointer;padding:9px 10px;font-size:13px;color:#9fd8ff;font-weight:600;list-style:none}
details.fxc>summary::-webkit-details-marker{display:none}
details.fxc>summary::before{content:'▸ ';color:var(--muted)}
details.fxc[open]>summary::before{content:'▾ '}
.fxb{padding:0 10px 9px}
@media (max-width:820px){main{grid-template-columns:1fr;grid-template-rows:55vh auto;height:auto}aside{border-left:0;border-top:1px solid var(--line)}}

/* vibrant theme (the cockpit's ◐): white, black type, red accent, pill buttons, flat */
html.gbv{--bg:#fff;--panel:#fff;--sunk:#fff;--ink:#000;--muted:#565C65;--line:#B9B9BB;--accent:#D83933;--mark:#D83933;--ok:#1f8a4c;--bad:#D83933;color-scheme:light}
html.gbv body{font:14px/1.55 "Public Sans",system-ui,sans-serif}
html.gbv.embed aside,html.gbv aside{background:#fff}
html.gbv section{border-radius:16px;padding:12px}
html.gbv h3{color:#000;font:700 15px/1.2 Inter,system-ui,sans-serif}
html.gbv input[type=number],html.gbv input[type=text],html.gbv select{background:#000;color:#fff;border:1px solid #565C65;border-radius:8px}
html.gbv button{background:#fff;border:1px solid #000;border-radius:50px;padding:6px 12px;font-weight:600;transition:transform .2s,background .2s}
html.gbv button:hover:not(:disabled){border-color:#000;background:#F4F4F5;transform:scale(1.05)}
html.gbv button.pri{background:#D83933;border-color:#D83933;color:#fff;font-weight:700}
html.gbv button.alpha{background:#000;border-color:#000;color:#fff;font-weight:700}
html.gbv button.on{background:#000;color:#fff;border-color:#000}
html.gbv .grid9 button{border-radius:8px}
html.gbv :is(input[type=range],input[type=checkbox]){accent-color:#D83933}
html.gbv :is(button,input,select,summary):focus-visible{outline:.25rem solid rgb(36,145,255);outline-offset:2px}
html.gbv #cv{background:repeating-conic-gradient(#e6e6e8 0 25%,#fff 0 50%) 0 0/24px 24px;box-shadow:0 0 0 1px #B9B9BB}
html.gbv #clips{background:#F4F4F5}
html.gbv #clips .add{background:#fff;color:#D83933}
html.gbv #clips .ph{background:#000}

/* Roboto for every page text (Vietnamese marks), and the gradient-dark accents (default theme) */
body,button,input,select,textarea{font-family:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif!important}
html.gbk{--bg:#08201a;--panel:#0d3028;--sunk:#10382f;--ink:#effbf8;--muted:#a8d8cd;--line:rgba(159,246,225,.22);--accent:#19df62;--mark:#4fed89}
html.gbk.embed aside{background:rgba(13,48,40,.94)}
html.gbk section{border-radius:15px}
html.gbk h3{color:#dcfced}
html.gbk h3 b{background:linear-gradient(120deg,#37966a,#19df62)}
html.gbk button{border-radius:15px;background:rgba(255,255,255,.06)}
html.gbk button:hover{border-color:#4fed89}
html.gbk button.pri{background:linear-gradient(120deg,#37966a,#19df62 60%,#4fed89);border-color:transparent}
html.gbk button.alpha{background:linear-gradient(120deg,#1c8c72,#0e8b51);border-color:transparent}
html.gbk :is(input[type=range],input[type=checkbox]){accent-color:#19df62}
</style>

<body>
<main>
  <div id="stage">
    <div id="wrap"><video id="vid" muted playsinline></video><canvas id="cv"></canvas></div>
    <div id="clips"></div>
    <div id="marks"></div>
    <div class="tl"><button id="undo" title="Ctrl+Z / Cmd+Z" disabled>↶</button><button id="redo" title="Ctrl+Shift+Z / Cmd+Shift+Z" disabled>↷</button><button id="play">▶</button><input type="range" id="seek" min="0" max="1000" value="0"><span id="time" class="sm" style="min-width:90px;text-align:right">0.00 s</span></div>
    <div class="sm" id="hint"></div>
  </div>
  <aside id="side"></aside>
</main>
<script>
(() => {
'use strict';
/* ---------------- language (VI / EN / KO; follows the Cockpit) ---------------- */
const qs = (location.search.match(/[?&]lang=(vi|en|ko)/) || [])[1];
let L = qs || (() => { try { return localStorage.getItem('gbc.lang') || 'vi'; } catch (e) { return 'vi'; } })();
const embed = window.self !== window.top || /[?&]embed=1/.test(location.search);
if (embed) document.documentElement.classList.add('embed');
const T = (vi, en, ko) => L === 'en' ? en : L === 'ko' ? (ko || en) : vi;
addEventListener('message', e => { if ((e.origin === location.origin || (location.protocol === 'file:' && e.origin === 'null')) && e.data && e.data.gbLang) { L = e.data.gbLang; render(); } });
addEventListener('message', e => { if ((e.origin === location.origin || (location.protocol === 'file:' && e.origin === 'null')) && e.data && e.data.gbHpPage) set_page(e.data.gbHpPage); }); // the cockpit's page switch (also works from file://)
const $ = id => document.getElementById(id);

/* ---------------- state ---------------- */
const SIZES = { '1080x1920': [1080, 1920], '1920x1080': [1920, 1080], '1080x1080': [1080, 1080], '1080x1350': [1080, 1350], '720x1280': [720, 1280] };
const DEF = {
  size: '1080x1920', fps: 30, dur: 12, bg: 'green', page: 'hp',
  hud: { on: true, x: 0.06, y: 0.05, scale: 1.45, shake: true, popups: true, lowPulse: true, flip: false },
  hero: { name: 'HERO', level: 25, showLevel: true, shape: 'circle', ring: '#ffd34d' },
  hp: { on: true, max: 1500, start: 1500, c1: '#ff4d4d', c2: '#c3121e', trail: '#ffe08a', back: '#2a0d12', numbers: true, w: 1, h: 1, round: 1, drain: 5, hold: 0.35 },
  mp: { on: false, max: 300, start: 300, c1: '#4da6ff', c2: '#1747c9', numbers: false },
  // boss: one big bar (name above, optional "x3" bar layers)
  boss: { on: false, name: 'DEMON LORD', max: 20000, start: 20000, x: 0.5, y: 0.1, w: 0.86, h: 54, c1: '#ff3d6e', c2: '#8a0a2a', trail: '#ffffff', back: '#1a0710', numbers: false, pct: true, layers: 1, round: 0.5, edge: '#ffd34d' },
  // countdown: just one number
  cd: { from: 10, to: 0, start: 0, x: 0.5, y: 0.45, size: 420, color: '#ffffff', stroke: '#000000', sw: 14, glow: '#ffb020', font: '900', format: 's', pop: true, ring: false, ringColor: '#ffb020', end: 'GO!', endHold: 1, warn: 3, warnColor: '#ff3d3d' },
  logo: { on: false, x: 0.7, y: 0.9, w: 0.26 },
  // end card: a card that grows 0 → 100 % from `start` over `grow` s; logo, app icon, name, stars and the button pop in after it
  // simple by default: the game blurred behind, the big logo + app icon, one fat PLAY NOW! button
  ec: { start: 0.2, grow: 0.6, ease: 'back', x: 0.5, y: 0.5, w: 0.86, back: 'blur', blur: 26, panel: false, panelColor: '#ffffff', panelAlpha: 1, radius: 56, dim: 0.12, bgColor: '#000000', title: 'XP HERO', titleColor: '#ffc21a', sub: '', stars: 0, cta: 'PLAY NOW!', ctaColor: '#3cc41a', ctaText: '#ffffff', pulse: true, gap: 0.12, hold: 2 },
  // video FX: blur / pixel masks (tracked), frames with a picture / video inside, red damage corners
  fx: { masks: [], sel: null, rec: false, trans: [], open: { blur: true, media: false, trans: true, vig: false }, vig: { on: false, color: '#ff0000', size: 0.42, strength: 0.85, dur: 0.6, hits: [1.5, 4], fromHp: true, low: false } },
  events: [{ t: 2, kind: 'dmg', v: 250 }, { t: 4.5, kind: 'dmg', v: 420 }, { t: 6, kind: 'heal', v: 300 }, { t: 8, kind: 'dmg', v: 600 }]
};
// deep merge so a project saved by an older version still gets the new fields
function merge (a, b) { for (const k in b) { if (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k]) && a[k] && typeof a[k] === 'object') merge(a[k], b[k]); else a[k] = b[k]; } return a; }
let S = (() => { try { const s = JSON.parse(localStorage.getItem('gb.hpbar') || 'null'); if (s && s.ec && s.ec.back === undefined) delete s.ec; /* the first end card design: start from the simple one */ return s ? merge(structuredClone(DEF), s) : structuredClone(DEF); } catch (e) { return structuredClone(DEF); } })();
{ const p = (location.search.match(/[?&]page=(hp|count|fx|end)/) || [])[1]; if (p) S.page = p; }
// the end card's parts (icon, logo, name, button): each with its own size, spacing, offset, anchor (gb-endcard.js)
S.ec.layer = window.GBEC ? GBEC.fix(S.ec.layer || Object.assign(GBEC.defaults('simple'), { title: S.ec.title || 'XP HERO', cta: S.ec.cta || 'PLAY NOW!' }), 'simple') : null;
const IMG = {}; // slot -> HTMLImageElement (kept in IndexedDB)
const SLOTS = [
  // id, VI, EN, base size at 1080 px wide (HUD scale 1)
  ['avatar', 'Ảnh nhân vật (avatar)', 'Hero picture (avatar)', 180, 180, 'PNG, nhân vật ở giữa', 'PNG, character centred'],
  ['avatarFrame', 'Khung avatar', 'Avatar frame', 224, 224, 'PNG nền trong suốt, giữa rỗng', 'transparent PNG, empty middle'],
  ['barFrame', 'Khung thanh máu', 'Bar frame', 640, 150, 'PNG trong suốt, chừa lỗ cho thanh', 'transparent PNG, hole for the bars'],
  ['hpFill', 'Vân thanh HP', 'HP bar fill', 560, 46, 'ảnh lặp ngang được', 'tileable horizontally'],
  ['mpFill', 'Vân thanh mana', 'Mana bar fill', 480, 26, 'ảnh lặp ngang được', 'tileable horizontally'],
  ['logo', 'Logo', 'Logo', 400, 160, 'PNG trong suốt', 'transparent PNG'],
  ['panel', 'Nền HUD (tuỳ chọn)', 'HUD backdrop (optional)', 820, 220, 'PNG, sau avatar + thanh', 'PNG, behind avatar + bars'],
  ['bossFill', 'Vân thanh máu boss', 'Boss bar fill', 930, 54, 'ảnh lặp ngang được', 'tileable horizontally'],
  ['bossFrame', 'Khung máu boss', 'Boss bar frame', 1004, 130, 'PNG trong suốt, chừa lỗ giữa cho thanh', 'transparent PNG, hole for the bar']
];
let W = 1080, H = 1920;
let t = 0, playing = false, last = 0, dirty = true, busy = false;
const cv = $('cv'), x = cv.getContext('2d'), vid0 = $('vid');
/* clips: the source video plus more videos joined after it (one timeline, so transitions can sit on the joins).
   `vid` is the clip playing now and `vid_off` the second it starts at. */
let vid = vid0, vid_off = 0;
const CLIPS = [vid0];
const clip_list = () => CLIPS.filter(v => v.src);
const clip_len = v => isFinite(v.duration) && v.duration > 0 ? v.duration : 0;
const clips_total = () => clip_list().reduce((a, v) => a + clip_len(v), 0);
function clip_at (tt) { const L = clip_list(); let off = 0; for (let i = 0; i < L.length; i++) { const d = clip_len(L[i]); if (tt < off + d - 1e-4 || i === L.length - 1) return { v: L[i], off, i }; off += d; } return { v: vid0, off: 0, i: 0 }; }
function use_clip (tt) { const c = clip_at(tt); if (c.v !== vid) { vid.pause(); vid = c.v; } vid_off = c.off; return c; }
/** jump the source video(s) to second tt of the timeline */
function goto (tt) { if (!vid0.src) return; use_clip(tt); vid.currentTime = Math.max(0, tt - vid_off); if (playing) vid.play().catch(() => {}); }
async function seek_g (tt) { if (!vid0.src) return; use_clip(tt); await seek(vid, tt - vid_off); }

function save () { try { localStorage.setItem('gb.hpbar', JSON.stringify(S)); } catch (e) {} }

/* images in IndexedDB (they are too big for localStorage) */
function idb () { return new Promise((res, rej) => { const r = indexedDB.open('gb-hpbar', 1); r.onupgradeneeded = () => r.result.createObjectStore('img'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function img_put (k, blob) { try { const db = await idb(); db.transaction('img', 'readwrite').objectStore('img').put(blob, k); } catch (e) {} }
async function img_del (k) { try { const db = await idb(); db.transaction('img', 'readwrite').objectStore('img').delete(k); } catch (e) {} }
async function img_load_all () {
  try {
    const db = await idb(); const st = db.transaction('img').objectStore('img');
    await new Promise(res => { const c = st.openCursor(); c.onsuccess = () => { const cur = c.result; if (!cur) return res(); set_img(cur.key, cur.value, false); cur.continue(); }; c.onerror = res; });
  } catch (e) {}
}
function set_img (k, blob, store = true) {
  if (String(k).startsWith('fxm_')) { fx_media_set(k, blob, store); return; }
  const im = new Image(); im.onload = () => { IMG[k] = im; dirty = true; render(); }; im.src = URL.createObjectURL(blob);
  if (store) img_put(k, blob);
}

/* ---------------- timeline simulation ---------------- */
let SIM = null; // cached 120 Hz samples
function sim () {
  if (SIM) return SIM;
  const R = 120, n = Math.ceil(S.dur * R) + 2;
  const ev = S.events.slice().sort((a, b) => a.t - b.t);
  // one HP track (real value, the bar shown, the delayed trail) for the hero and one for the boss
  const track = (who, max, start) => {
    const hp = new Float32Array(n), shown = new Float32Array(n), trail = new Float32Array(n);
    let real = clamp(start, 0, max), cur = real, tr = real, k = 0, hold = 0;
    const mine = ev.filter(e => (e.who || 'hero') === who);
    for (let i = 0; i < n; i++) {
      const tt = i / R;
      while (k < mine.length && mine[k].t <= tt) {
        const e = mine[k++], v = Math.abs(Number(e.v) || 0);
        if (e.kind === 'dmg') { real = clamp(real - v, 0, max); hold = S.hp.hold; }
        else if (e.kind === 'heal') real = clamp(real + v, 0, max);
        else if (e.kind === 'set') real = clamp(v, 0, max);
      }
      const dt = 1 / R;
      cur += (real - cur) * Math.min(1, dt * 18);           // the bar snaps quickly
      if (real >= tr) tr = cur;                              // healing: the trail follows the bar
      else if (hold > 0) hold -= dt; else tr += (real - tr) * Math.min(1, dt * S.hp.drain); // damage: the trail waits, then drains
      hp[i] = real; shown[i] = cur; trail[i] = tr;
    }
    return { hp, shown, trail };
  };
  const mp = new Float32Array(n), mps = new Float32Array(n);
  let rmp = clamp(S.mp.start, 0, S.mp.max), curm = rmp, k = 0;
  for (let i = 0; i < n; i++) {
    while (k < ev.length && ev[k].t <= i / R) { const e = ev[k++], v = Math.abs(Number(e.v) || 0); if (e.kind === 'mana-') rmp = clamp(rmp - v, 0, S.mp.max); else if (e.kind === 'mana+') rmp = clamp(rmp + v, 0, S.mp.max); }
    curm += (rmp - curm) * Math.min(1, 10 / R); mp[i] = rmp; mps[i] = curm;
  }
  const h = track('hero', S.hp.max, S.hp.start), b = track('boss', S.boss.max, S.boss.start);
  SIM = { R, hp: h.hp, shown: h.shown, trail: h.trail, mp: mps, ev, boss: b };
  return SIM;
}
function clamp (v, a, b) { return Math.max(a, Math.min(b, v)); }
function at (arr, tt) { const s = sim(); const i = clamp(Math.round(tt * s.R), 0, arr.length - 1); return arr[i]; }
function invalidate () { SIM = null; dirty = true; save(); draw_marks(); }

/* ---------------- drawing ---------------- */
function rr (c, X, Y, w, h, r) { r = Math.min(r, w / 2, h / 2); c.beginPath(); c.moveTo(X + r, Y); c.arcTo(X + w, Y, X + w, Y + h, r); c.arcTo(X + w, Y + h, X, Y + h, r); c.arcTo(X, Y + h, X, Y, r); c.arcTo(X, Y, X + w, Y, r); c.closePath(); }
function layout () {

      else if (a === 'vid2') { $('fVid2').click(); return; }
      else if (a === 'mp4') { export_mp4(); return; } else if (a === 'mov') { export_mov(); return; } else if (a === 'png') { export_png(); return; }
      else if (a === 'json') { download(new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' }), 'hp-bar-project.json'); return; }
      else if (a === 'open') { $('fJson').click(); return; }
      invalidate(); render();
    };
  });
  $('fImg').onchange = e => { const f = e.target.files[0]; if (f && up_slot) { set_img(up_slot, f); if (up_slot === 'logo') S.logo.on = true; save(); } e.target.value = ''; };
  $('fVid').onchange = e => { const f = e.target.files[0]; if (!f) return; vid0.src = URL.createObjectURL(f); vid0.dataset.name = f.name; vid0.style.opacity = '0.6'; vid0.onloadedmetadata = () => { if (clips_total() > 0) { S.dur = Math.round(clips_total() * 100) / 100; invalidate(); render(); } }; e.target.value = ''; };
  $('fVid2').onchange = e => { for (const f of e.target.files) clip_add(f); e.target.value = ''; };
  side.querySelectorAll('[data-clipdel]').forEach(b => { b.onclick = () => clip_del(Number(b.dataset.clipdel)); });
  $('fJson').onchange = async e => { const f = e.target.files[0]; if (!f) return; try { S = merge(structuredClone(DEF), JSON.parse(await f.text())); resize(); invalidate(); render(); } catch (err) { msg(String(err), true); } e.target.value = ''; };

  refresh: () => { resize(); invalidate(); render(); }, snapshot: () => { paint(x, t, S.bg === 'clear' ? 'black' : S.bg); const c = document.createElement('canvas'); const k = Math.min(1, 720 / H); c.width = Math.round(W * k); c.height = Math.round(H * k); c.getContext('2d').drawImage(cv, 0, 0, c.width, c.height); dirty = true; return c.toDataURL('image/jpeg', 0.85); } };
