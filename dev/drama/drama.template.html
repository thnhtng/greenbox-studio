<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Greenbox AI Drama</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* the layout of DramaClaw (near-black, grey panels), in Greenbox green, simplified for one person making an AI drama */
:root{--bg:#0a0a0a;--p1:#141414;--p2:#1b1b1b;--p3:#232323;--ln:#262626;--ln2:#333;--tx:#ececec;--mu:#8d8d8d;--mu2:#6b6b6b;--ac:#2fe98b;--ac2:#16a34a;--acbg:#0f2a1d;--ok:#34d399;--wa:#fbbf24;--er:#f87171;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.55 "Be Vietnam Pro",system-ui,-apple-system,sans-serif;word-break:keep-all;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
/* top bar */
.top{display:flex;align-items:center;gap:12px;height:52px;padding:0 16px;border-bottom:1px solid var(--ln);flex:none}
.logo{font-weight:700;letter-spacing:-.02em;font-size:15px;white-space:nowrap}
.logo i{font-style:normal;color:var(--ac)}
.proj{display:flex;align-items:center;gap:6px;color:var(--mu)}
.proj select{background:transparent;border:0;color:var(--tx);font-weight:500;max-width:220px}
.sp{flex:1}
.claude{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mu);border:1px solid var(--ln2);border-radius:999px;padding:3px 10px;white-space:nowrap;cursor:pointer;min-width:0;overflow:hidden;text-overflow:ellipsis}
.lang{display:flex;gap:4px;flex:none}
.proj{min-width:0}
@media (max-width:900px){#clt{display:none}.claude::after{content:"Claude"}}
.claude i{width:8px;height:8px;border-radius:50%;background:var(--mu2)}
.claude.on i{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.claude.work i{background:var(--wa);animation:pulse 1s infinite}
.claude.half i{background:var(--wa)}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:9;padding:16px}
.modal.open{display:flex}
.modal .box{background:var(--p1);border:1px solid var(--ln2);border-radius:18px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:20px}
.modal h2{margin:0 0 4px;font-size:18px}
.st{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--ln)}
.st .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--p3);font-size:12.5px;font-weight:600}
.st .n.ok{background:#16a34a;color:#fff}
.st code{display:block;background:var(--p2);border:1px solid var(--ln2);border-radius:8px;padding:6px 8px;margin-top:6px;font-size:12px;word-break:break-all}
@keyframes pulse{50%{opacity:.35}}
.lang button{background:none;border:1px solid var(--ln2);color:var(--mu);border-radius:8px;padding:2px 8px;font-size:12px}
.lang button.on{background:var(--p3);color:var(--tx)}
/* step pills (like DramaClaw's series nav) */
.nav{display:flex;justify-content:center;padding:10px 16px 0;flex:none}
.pills{display:flex;gap:2px;background:var(--p1);border:1px solid var(--ln);border-radius:12px;padding:3px;overflow-x:auto;max-width:100%}
.pills button{background:none;border:0;border-radius:9px;padding:6px 14px;color:var(--mu);white-space:nowrap;font-size:13px;font-weight:500;transition:background-color .15s,color .15s}
.pills button.on{background:#16a34a;color:#fff}
.pills button:disabled{opacity:.35;cursor:not-allowed}
.pills b{color:var(--ok);font-weight:600}
.pills .pi{width:20px;height:20px;vertical-align:-5px;margin-right:6px}
/* page */
main{flex:1;overflow:auto;padding:0 16px 24px}
.wrap{max-width:1120px;margin:0 auto}
.head{display:flex;align-items:center;gap:14px;margin:26px 0 18px}
.hic{width:42px;height:42px;border-radius:12px;background:linear-gradient(#36d36a,#16a34a);color:#fff;display:grid;place-items:center;font-size:20px;flex:none}
.head h1{margin:0;font-size:22px;line-height:1.3;letter-spacing:-.01em}
.head p{margin:2px 0 0;color:var(--mu);font-size:13px}
.panel{background:var(--p1);border:1px solid var(--ln);border-radius:var(--r);padding:18px}
.panel+.panel{margin-top:14px}
.seg{display:inline-flex;background:var(--p2);border-radius:9px;padding:3px;gap:2px}
.seg button{background:none;border:0;border-radius:7px;padding:4px 12px;color:var(--mu);font-size:13px}
.seg button.on{background:#16a34a;color:#fff}
textarea,input[type=text],input[type=number],select{background:var(--p2);border:1px solid var(--ln2);border-radius:10px;padding:8px 10px;width:100%}
textarea{resize:vertical;min-height:80px;line-height:1.6}
select{appearance:none;-webkit-appearance:none;padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.story{min-height:260px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;min-width:150px;flex:1}
.field label{font-size:12px;color:var(--mu)}
.btn{border:1px solid var(--ln2);background:var(--p2);border-radius:10px;padding:8px 14px;font-weight:500;transition:background-color .15s,transform .15s;white-space:nowrap}
.btn:hover{background:var(--p3)}
.btn:active{transform:scale(.98)}
.btn.pri{background:linear-gradient(#36d36a,#16a34a);border-color:#16a34a;color:#fff;font-weight:600}
.btn.pri:hover{background:#16a34a}
.btn.ok{border-color:#1f6b52;color:#9ff0cf;background:#0f2a22}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.sm{padding:4px 10px;font-size:12.5px;border-radius:8px}
.mut{color:var(--mu)}.small{font-size:12px}
.wait{display:flex;align-items:center;gap:10px;background:var(--acbg);border:1px solid #1f6b45;border-radius:12px;padding:10px 14px;margin:0 0 14px;color:#bff7d6;font-size:13px}
.spin{width:14px;height:14px;border:2px solid #1f6b45;border-top-color:var(--ac);border-radius:50%;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{border:1px dashed var(--ln2);border-radius:var(--r);padding:36px;text-align:center;color:var(--mu)}
/* script */
.split{display:grid;grid-template-columns:220px 1fr;gap:14px;align-items:start}
.eps{display:flex;flex-direction:column;gap:4px;position:sticky;top:0}
.eps button{text-align:left;background:var(--p1);border:1px solid var(--ln);border-radius:10px;padding:8px 10px;color:var(--mu)}
.eps button.on{border-color:var(--ac);color:var(--tx);background:var(--acbg)}
.eps small{display:block;font-size:11.5px;color:var(--mu2)}
.beat{background:var(--p1);border:1px solid var(--ln);border-radius:12px;padding:12px;display:grid;gap:8px}
.beat+.beat{margin-top:10px}
.bh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font-size:11.5px;border-radius:6px;padding:1px 8px;background:var(--p3);color:var(--mu)}
.tag.ac{background:var(--acbg);color:#9ef5c4}
.tag.ok{background:#0f2a22;color:#9ff0cf}
.tag.wa{background:#2b230b;color:#fde68a}
.beat textarea{min-height:52px}
details summary{cursor:pointer;color:var(--mu);font-size:12.5px}
/* characters */
.chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.char{background:var(--p1);border:1px solid var(--ln);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.pic{aspect-ratio:3/4;background:var(--p2);display:grid;place-items:center;color:var(--mu2);font-size:12.5px;position:relative;overflow:hidden}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#0e0e0e;cursor:zoom-in}
.pic .src{position:absolute;left:8px;top:8px;z-index:1}
.view{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:10;padding:16px;cursor:zoom-out}
.view.open{display:flex}
.view img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px}
.char .bd{padding:12px;display:grid;gap:8px}
.char input.nm{font-weight:600;font-size:15px}
/* production */
.epbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.epbar button{border:1px solid var(--ln);background:var(--p1);border-radius:9px;padding:5px 12px;color:var(--mu);font-size:13px}
.epbar button.on{border-color:var(--ac);color:var(--tx)}
.epbar button:disabled{opacity:.35;cursor:not-allowed}
.pb{display:grid;grid-template-columns:150px 1fr;gap:12px}
.vid{aspect-ratio:9/16;background:var(--p2);border-radius:10px;overflow:hidden;display:grid;place-items:center;color:var(--mu2);font-size:12px;text-align:center;padding:4px}
.vid.wide{aspect-ratio:16/9}
.vid video{width:100%;height:100%;object-fit:cover;display:block}
.flash{animation:fl 1.2s ease-out}
@keyframes fl{0%{box-shadow:0 0 0 2px var(--ac)}100%{box-shadow:0 0 0 0 transparent}}
.clips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.pb2{display:grid;grid-template-columns:240px 1fr;gap:12px}
.media{display:grid;grid-template-columns:1fr 1fr;gap:6px;align-content:start}
.vid img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.idea{display:flex;gap:6px}
.idea input{flex:1}
@media (max-width:820px){.pb2{grid-template-columns:1fr}}
.clips .vid{width:110px;flex:none}
/* bottom bar + log drawer (DramaClaw's task centre) */
.foot{display:flex;align-items:center;gap:10px;height:34px;padding:0 16px;border-top:1px solid var(--ln);font-size:12.5px;color:var(--mu);flex:none}
.foot button{background:none;border:0;color:var(--mu);padding:0}
.log{position:fixed;right:16px;bottom:44px;width:min(420px,calc(100vw - 32px));max-height:50vh;overflow:auto;background:var(--p1);border:1px solid var(--ln2);border-radius:var(--r);padding:12px;box-shadow:0 18px 50px #000a;display:none;z-index:5}
.log.open{display:block}
.log div{padding:6px 0;border-bottom:1px solid var(--ln);font-size:12.5px}
.log b{font-weight:600}
.who-claude{color:#9ef5c4}.who-user{color:#fde68a}
@media (max-width:820px){.split{grid-template-columns:1fr}.eps{position:static;flex-direction:row;overflow-x:auto}.pb{grid-template-columns:110px 1fr}}
@media (prefers-reduced-motion:reduce){*{animation-duration:100ms!important;transition-duration:100ms!important}}
</style>
</head>
<body>
<div class="top">
  <div class="logo">Greenbox <i>Drama</i></div>
  <div class="proj"><span>/</span><select id="proj" aria-label="project"></select><button class="btn sm" id="newp" title="+">＋</button></div>
  <span class="sp"></span>
  <div class="claude" id="cl"><i></i><span id="clt"></span></div>
  <div class="lang"><button data-set="vi">VI</button><button data-set="en">EN</button></div>
</div>
<div class="nav"><div class="pills" id="pills"></div></div>
<main><div class="wrap" id="page"></div></main>
<div class="foot"><button id="tc">▴ <span id="tct"></span></button><span class="sp"></span><span id="ft"></span></div>
<div class="log" id="log"></div>
<div class="modal" id="howto"><div class="box" id="howbox"></div></div>
<div class="view" id="view"></div>
<input type="file" id="fimg" accept="image/*" hidden>
<input type="file" id="fvid" accept="video/*" hidden>
<input type="file" id="ftxt" accept=".txt,.md,text/plain" hidden>
<script>
'use strict'
/* ---------------- words ---------------- */
let LANG = 'vi'
const W = {
  steps: [['src', '① Nguồn truyện', '① Story'], ['script', '② Kịch bản', '② Script'], ['chars', '③ Nhân vật', '③ Characters'], ['prod', '④ Sản xuất', '④ Production'], ['edit', '⑤ Dựng & xuất', '⑤ Edit & export']],
  types: [['series', 'Phim bộ (nhiều tập)', 'Series'], ['single', 'Phim lẻ', 'Single film']],
  genres: [['romance', 'Ngôn tình', 'Romance'], ['ceo', 'Tổng tài', 'CEO romance'], ['revenge', 'Báo thù', 'Revenge'], ['palace', 'Cung đấu', 'Palace intrigue'], ['xianxia', 'Tiên hiệp', 'Xianxia'], ['transmig', 'Xuyên không', 'Time travel'], ['family', 'Gia đình', 'Family'], ['school', 'Học đường', 'School'], ['action', 'Hành động', 'Action'], ['comedy', 'Hài', 'Comedy'], ['horror', 'Kinh dị', 'Horror'], ['mystery', 'Trinh thám', 'Mystery']],
  styles: [['realistic', 'Hiện đại tả thực', 'Modern realistic'], ['chinesePeriodDrama', 'Cổ trang Trung Hoa', 'Chinese period drama'], ['guoman3d', 'Tiên hiệp Quốc mạn 3D', 'Guoman 3D fantasy'], ['anime', 'Anime', 'Anime'], ['republican', 'Dân Quốc', 'Republican era'], ['postApocalyptic', 'Hậu tận thế', 'Post-apocalyptic'], ['pixar3d', 'Hoạt hình 3D', '3D animation']],
  countries: [['vietnamese', 'Việt Nam', 'Vietnam'], ['chinese', 'Trung Quốc', 'China'], ['korean', 'Hàn Quốc', 'Korea'], ['japanese', 'Nhật Bản', 'Japan'], ['western', 'Phương Tây', 'Western'], ['mixed', 'Lai', 'Mixed']],
  ratios: [['9:16', '9:16 dọc', '9:16 vertical'], ['16:9', '16:9 ngang', '16:9 landscape']],
  filmDur: [[60, '1 phút', '1 min'], [120, '2 phút', '2 min'], [180, '3 phút', '3 min'], [300, '5 phút', '5 min'], [600, '10 phút', '10 min'], [900, '15 phút', '15 min'], [1800, '30 phút', '30 min'], [3600, '1 tiếng', '1 hour']],
  epDur: [[30, '30 giây', '30 s'], [60, '1 phút', '1 min'], [90, '1,5 phút', '1.5 min'], [120, '2 phút', '2 min'], [180, '3 phút', '3 min'], [300, '5 phút', '5 min'], [600, '10 phút', '10 min'], [1200, '20 phút', '20 min'], [1800, '30 phút', '30 min'], [2700, '45 phút', '45 min'], [3600, '1 tiếng', '1 hour']],
  clip: [[5, '5 s'], [10, '10 s'], [15, '15 s']]
}
const t = (vi, en) => LANG === 'en' ? en : vi
const opt = (list, v) => list.map(o => `<option value="${o[0]}"${String(o[0]) === String(v) ? ' selected' : ''}>${LANG === 'en' ? (o[2] ?? o[1]) : o[1]}</option>`).join('')
const lab = (list, v) => { const o = list.find(x => String(x[0]) === String(v)); return o ? (LANG === 'en' ? (o[2] ?? o[1]) : o[1]) : v }
const h = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const $ = id => document.getElementById(id)
const fmtS = s => s >= 60 ? `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}` : `${Math.round(s)}s`

/* ---------------- state: projects in localStorage, pictures / clips in IndexedDB ---------------- */
const KEY = 'gb.drama.v1'
function blank (name) {
  return { id: 'p' + Date.now().toString(36), name, tab: 'src', ep: 0,
    src: { mode: 'paste', text: '', unlimited: true, type: 'series', genre: 'romance', style: 'realistic', country: 'vietnamese', ratio: '9:16', film_sec: 120, ep_sec: 60, eps_n: 5, clip: 10 },
    script: null, chars: [], approved: { script: false, chars: false }, queue: [], seq: 0, log: [] }
}
let S
try { S = JSON.parse(localStorage.getItem(KEY) || 'null') } catch { S = null }
if (!S || !S.projects) { const p = blank(t('Phim đầu tiên', 'First film')); S = { cur: p.id, projects: { [p.id]: p } } }
const P = () => S.projects[S.cur]
let saveT = 0
function save () { clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(S)) } catch (e) { console.warn(e) } }, 150) }
const DB = new Promise((res, rej) => { const r = indexedDB.open('gb-drama', 1); r.onupgradeneeded = () => r.result.createObjectStore('m'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error) })
const idb = {
  async put (k, blob) { const d = await DB; return new Promise((res, rej) => { const x = d.transaction('m', 'readwrite'); x.objectStore('m').put(blob, k); x.oncomplete = res; x.onerror = () => rej(x.error) }) },
  async get (k) { const d = await DB; return new Promise((res, rej) => { const q = d.transaction('m').objectStore('m').get(k); q.onsuccess = () => res(q.result || null); q.onerror = () => rej(q.error) }) },
  async del (k) { const d = await DB; return new Promise(res => { const x = d.transaction('m', 'readwrite'); x.objectStore('m').delete(k); x.oncomplete = res }) }
}
const urls = new Map()
async function url (k) { if (!k) return ''; if (urls.has(k)) return urls.get(k); const b = await idb.get(k); if (!b) return ''; const u = URL.createObjectURL(b); urls.set(k, u); return u }
async function putMedia (k, blob) { if (urls.has(k)) { URL.revokeObjectURL(urls.get(k)); urls.delete(k) } await idb.put(k, blob); return k }
function b64blob (b64, mime) { const s = atob(b64.replace(/^data:[^,]*,/, '')); const a = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return new Blob([a], { type: mime }) }
async function blobB64 (b) { const buf = new Uint8Array(await b.arrayBuffer()); let s = ''; for (let i = 0; i < buf.length; i += 0x8000) s += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000)); return btoa(s) }

/* ---------------- log + requests to Claude (through Greenbox's chat inbox → gb_inbox / gb_drama over MCP) ---------------- */
let lastClaude = 0
function log (who, text) { const p = P(); p.log.unshift({ t: Date.now(), who, text: String(text) }); p.log = p.log.slice(0, 200); if (who === 'claude') lastClaude = Date.now(); save(); drawFoot(); drawLog() }
function inbox () { try { return (window.parent !== window && parent.__gbInbox) || window.__gbInbox || null } catch { return window.__gbInbox || null } }
function ask (kind, data, label) {
  const p = P(); const id = ++p.seq
  p.queue.push({ id, kind, data: data || {}, label, t: Date.now(), status: 'wait' })
  const text = `[AI Drama #${id}] ${kind}: ${label}. Đọc gb_drama {action:"get"}, làm xong gọi gb_drama {action:"done", id:${id}}.`
  const ib = inbox(); if (ib) ib.push({ text, t: Date.now() })
  log('user', label + (ib ? '' : t(' (chưa có kết nối Greenbox ↔ Claude: mở trang này trong Greenbox Cockpit)', ' (no Greenbox ↔ Claude link: open this page inside the Greenbox Cockpit)')))
  render()
  if (!claudeState().live) { $('howto').classList.add('open'); drawHow() }
}
const pending = kind => P().queue.filter(q => q.status === 'wait' && (!kind || q.kind === kind))

/* ---------------- script helpers ---------------- */
const eps = () => (P().script && P().script.eps) || []
const allBeats = () => eps().flatMap((e, i) => (e.beats || []).map((b, j) => ({ e, b, i, j })))
const SEG_SEC = 300
const lenOf = src => src.type === 'single' ? +src.film_sec : +src.ep_sec
const isLong = src => lenOf(src) > SEG_SEC
const segBeats = (e, k) => (e.beats || []).map((b, j) => ({ b, j })).filter(x => (x.b.seg || 0) === k)
const segDone = (e, k) => { const L = segBeats(e, k); return L.length > 0 && L.every(x => x.b.clip) }
const epDone = e => e.segs && e.segs.length ? e.segs.every((_, k) => segDone(e, k)) : (e.beats || []).length > 0 && e.beats.every(b => b.clip)
function charByName (n) { return P().chars.find(c => c.name.toLowerCase() === String(n).toLowerCase()) }
function renameChar (c, nn) {
  const old = c.name; nn = nn.trim(); if (!nn || nn === old) return
  const re = new RegExp(old.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g')
  for (const e of eps()) for (const b of e.beats || []) {
    b.chars = (b.chars || []).map(x => x === old ? nn : x)
    for (const l of b.lines || []) { if (l.who === old) l.who = nn; l.text = String(l.text).replace(re, nn) }
    b.action = String(b.action || '').replace(re, nn); b.prompt = String(b.prompt || '').replace(re, nn)
  }
  c.name = nn; log('user', t(`Đổi tên nhân vật: ${old} → ${nn}`, `Renamed: ${old} → ${nn}`))
}
const linesTxt = b => (b.lines || []).map(l => `${l.who}: ${l.text}`).join('\n')
const parseLines = s => s.split('\n').map(x => x.trim()).filter(Boolean).map(x => { const i = x.indexOf(':'); return i > 0 ? { who: x.slice(0, i).trim(), text: x.slice(i + 1).trim() } : { who: '', text: x } })

/* ---------------- rendering ---------------- */
function can (tab) {
  const p = P()
  if (tab === 'src') return true
  if (tab === 'script') return !!p.script || pending('write_script').length > 0
  if (tab === 'chars') return !!p.script
  if (tab === 'prod') return p.approved.script && p.approved.chars
  if (tab === 'edit') return allBeats().some(x => x.b.clip)
}
function drawTop () {

    p.chars = (sc.chars || []).map(c => ({ name: c.name, role: c.role || '', look: c.look || c.desc || '', img: keep.get(c.name)?.img || null, src: keep.get(c.name)?.src || null }))
    p.approved = { script: false, chars: false }; p.tab = 'script'; p.ep = 0
    log('claude', t(`Kịch bản: "${p.script.title}", ${p.script.eps.length} ${p.src.type === 'single' ? 'phim' : 'tập'}, ${p.chars.length} nhân vật`, `Script: "${p.script.title}", ${p.script.eps.length} part(s), ${p.chars.length} characters`))
    save(); render(); return 'ok'
  },
  /** a long film / episode: the beats of one part {ep, seg, beats: [{scene, chars, action, lines, sec, prompt}]} (that part's old beats are replaced) */
  beats (a) {
    const p = P(); const e = eps()[a.ep]; if (!e) throw new Error('no episode ' + a.ep); if (!e.segs || !e.segs[a.seg]) throw new Error('no part ' + a.seg)
    const keep = (e.beats || []).filter(b => (b.seg || 0) !== a.seg)
    const add = (a.beats || []).map(b => ({ seg: a.seg, scene: b.scene || '', chars: b.chars || [], action: b.action || '', lines: b.lines || [], sec: +b.sec || p.src.clip, prompt: b.prompt || '', clip: null, status: 'todo' }))
    e.beats = keep.concat(add).sort((x, y) => (x.seg || 0) - (y.seg || 0))
    p.ep = a.ep; p.seg = a.seg; if (p.tab === 'src') p.tab = 'script'
    log('claude', t(`Viết ${add.length} nhịp cho đoạn ${a.seg + 1}${p.src.type === 'single' ? '' : ', tập ' + (a.ep + 1)}`, `Wrote ${add.length} beats for part ${a.seg + 1}${p.src.type === 'single' ? '' : ', ep. ' + (a.ep + 1)}`))
    save(); render(); return 'ok'
  },
  /** set a character's fields / picture: {name, new_name?, role?, look?, data_b64?, mime?, source?} */
  async char (a) {
    const p = P(); const c = charByName(a.name); if (!c) throw new Error('no character ' + a.name)
    if (a.new_name) renameChar(c, a.new_name); if (a.role !== undefined) c.role = a.role; if (a.look !== undefined) c.look = a.look
    if (a.data_b64) { c.img = await putMedia(`${p.id}/char/${c.name}/${Date.now()}`, b64blob(a.data_b64, a.mime || 'image/png')); c.src = a.source || 'higgsfield'; log('claude', t(`Ảnh nhân vật ${c.name} (${c.src})`, `Picture for ${c.name} (${c.src})`)) }
    if (p.tab !== 'chars' && p.script) p.tab = 'chars'
    save(); render(); flash(`[data-ci="${p.chars.indexOf(c)}"]`); return 'ok'
  },
  /** attach a generated clip: {ep, beat, data_b64, mime?} */
  async clip (a) {
    const p = P(); const b = (eps()[a.ep] || {}).beats?.[a.beat]; if (!b) throw new Error('no beat')
    b.clip = await putMedia(`${p.id}/clip/${a.ep}/${a.beat}/${Date.now()}`, b64blob(a.data_b64, a.mime || 'video/mp4')); b.status = 'done'
    if (a.sec) b.sec = +a.sec
    p.tab = 'prod'; p.ep = a.ep; p.seg = b.seg || 0; log('claude', t(`Clip nhịp ${a.beat + 1}${p.src.type === 'single' ? '' : ', tập ' + (a.ep + 1)}`, `Clip for beat ${a.beat + 1}${p.src.type === 'single' ? '' : ', ep. ' + (a.ep + 1)}`))
    save(); render(); flash(`[data-bj="${a.beat}"]`); return 'ok'
  },
  /** Claude's prompts for one beat: {ep, beat, img_prompt?, prompt?} */
  prompts (a) { const b = eps()[a.ep]?.beats?.[a.beat]; if (!b) throw new Error('no beat'); if (a.img_prompt !== undefined) b.img_prompt = a.img_prompt; if (a.prompt !== undefined) b.prompt = a.prompt; P().tab = 'prod'; P().ep = a.ep; P().seg = b.seg || 0; log('claude', t(`Prompt nhịp ${a.beat + 1}`, `Prompts for beat ${a.beat + 1}`)); save(); render(); flash(`[data-bj="${a.beat}"]`); return 'ok' },
  /** the beat's scene picture (Higgsfield image): {ep, beat, data_b64, mime?} */
  async still (a) { const p = P(); const b = eps()[a.ep]?.beats?.[a.beat]; if (!b) throw new Error('no beat'); b.still = await putMedia(`${p.id}/still/${a.ep}/${a.beat}/${Date.now()}`, b64blob(a.data_b64, a.mime || 'image/png')); if (b.status === 'img') b.status = 'todo'; p.tab = 'prod'; p.ep = a.ep; p.seg = b.seg || 0; log('claude', t(`Ảnh nhịp ${a.beat + 1}`, `Picture for beat ${a.beat + 1}`)); save(); render(); flash(`[data-bj="${a.beat}"]`); return 'ok' },
  /** mark a beat as being generated (the user sees a spinner): {ep, beat, status: 'gen' | 'todo'} */
  beat (a) { const b = eps()[a.ep]?.beats?.[a.beat]; if (!b) throw new Error('no beat'); b.status = a.status || 'gen'; if (a.prompt) b.prompt = a.prompt; P().tab = 'prod'; P().ep = a.ep; P().seg = b.seg || 0; save(); render(); flash(`[data-bj="${a.beat}"]`); return 'ok' },
  /** episode title / hook / summary: {ep, title?, hook?, summary?} */
  episode (a) { const e = eps()[a.ep]; if (!e) throw new Error('no episode'); for (const k of ['title', 'hook', 'summary']) if (a[k] !== undefined) e[k] = a[k]; log('claude', t(`Tập ${a.ep + 1}: ${e.title || ''}${e.hook ? ' · hook: ' + e.hook : ''}`, `Ep. ${a.ep + 1}: ${e.title || ''}${e.hook ? ' · hook: ' + e.hook : ''}`)); save(); render(); return 'ok' },
  /** one clip as base64 (the MCP saves it to disk to join with ffmpeg) */
  async clip_out (a) { const b = eps()[a.ep]?.beats?.[a.beat]; if (!b || !b.clip) throw new Error('no clip'); const blob = await idb.get(b.clip); return { name: `ep${a.ep + 1}_beat${String(a.beat + 1).padStart(2, '0')}.${/webm/.test(blob.type) ? 'webm' : /quicktime/.test(blob.type) ? 'mov' : 'mp4'}`, b64: await blobB64(blob) } },
  /** the joined episode: {ep, data_b64} */
  async merged (a) { const p = P(); const e = eps()[a.ep]; if (!e) throw new Error('no episode'); e.merged = await putMedia(`${p.id}/merged/${a.ep}/${Date.now()}`, b64blob(a.data_b64, 'video/mp4')); p.tab = 'edit'; log('claude', t(`Đã ghép ${p.src.type === 'single' ? 'phim' : 'tập ' + (a.ep + 1)}`, `Joined ${p.src.type === 'single' ? 'the film' : 'episode ' + (a.ep + 1)}`)); save(); render(); return 'ok' },
  say (text) { log('claude', text); return 'ok' },
  done (id, note) { const q = P().queue.find(x => x.id === +id); if (!q) throw new Error('no request #' + id); q.status = 'done'; log('claude', `#${id} ✓ ${q.label}${note ? ' — ' + note : ''}`); save(); render(); return 'ok' },
  tab (name) { if (!can(name)) throw new Error('tab not open yet: ' + name); P().tab = name; save(); render(); return 'ok' },
  ping () { lastClaude = Date.now(); drawClaude(); return 'ok' }
}
